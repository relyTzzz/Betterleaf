appId: me.betterleaf.app
productName: Betterleaf
copyright: Cranium AI

directories:
  buildResources: build
  output: release

# Everything the app runs is bundled into out/ by electron-vite — the protocol
# layer included — so there are no runtime node_modules to ship. That keeps the
# package small and sidesteps electron-builder's usual trouble with pnpm's
# symlinked workspace packages.
files:
  - out/**
  - package.json

# The window icon is embedded in the exe by electron-builder, but the tray needs
# a real file it can load at runtime, and asar-packed paths are not one. Shipping
# it unpacked beside the app is the least fragile way to have a tray icon that is
# actually visible — an invisible one would mean a running app with no way back
# to its window.
extraResources:
  - from: build/icon.ico
    to: icon.ico

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # A normal installer rather than a one-click one: the point of packaging this
  # is a real Start Menu entry and desktop icon, and being able to uninstall it
  # like anything else.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Betterleaf
  artifactName: Betterleaf-Setup-${version}.${ext}
